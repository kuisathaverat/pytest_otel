---
## continuous deployment workflow
name: cd

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run linting
    runs-on: ubuntu-latest
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
          ref: ${{ github.sha || 'main' }}
      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache-dependency-path: pyproject.toml
      - name: run-lint
        run: make lint
  test-python:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
          ref: ${{ github.sha || 'main' }}
      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: pyproject.toml
      - name: run-test
        run: make test
      - name: run-it-test
        run: make it-test
  release:
    runs-on: ubuntu-latest
    needs: [lint, test-python]
    permissions:
      # write permission is required to create a github release
      contents: write
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
          ref: ${{ github.sha || 'main' }}
      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache-dependency-path: pyproject.toml

      - name: check-version-change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        id: check_version
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('src/pytest_otel/__init__.py', 'utf8').match(/__version__ = (.*)/)[1].trim().replace(/"/g, '');
            const { data: latestRelease } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            if (`${latestRelease.tag_name}` ==  `v${version}` ) {
              core.setOutput('release', 'false' );
            } else {
              core.setOutput('release', 'true' );
              core.setOutput('version', version );
            }
            core.info(`version: v${version}`);
            core.info(`latestRelease: ${latestRelease.tag_name}`);
      - name: release
        if: ${{ steps.check_version.outputs.release == 'true'}}
        id: release
        run: make publish
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          REPO_URL: ${{ secrets.REPO_URL }}
      - name: publish-release-drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # ratchet:release-drafter/release-drafter@v7.7.0
        if: ${{ steps.check_version.outputs.release == 'true'}}
        with:
          version: ${{ steps.check_version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
