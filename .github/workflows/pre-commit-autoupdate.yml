---
## Dependabot does not natively support the pre-commit hook ecosystem, so this
## workflow keeps .pre-commit-config.yaml hook revisions current by running
## `pre-commit autoupdate` on a schedule and opening a pull request with any
## changes, mirroring how Dependabot updates other ecosystems.
name: pre-commit-autoupdate

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # ratchet:peter-evans/create-pull-request@v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: pre-commit autoupdate"
          title: "chore: pre-commit autoupdate"
          body: >
            Automated update of `.pre-commit-config.yaml` hook revisions via
            `pre-commit autoupdate`.
          branch: pre-commit-autoupdate
          labels: chore
          delete-branch: true
