[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest_otel"
dynamic = ["version"]
description = "OpenTelemetry plugin for Pytest"
readme =  {file = "README.md", content-type = "text/markdown"}
authors = [
  {name = "Ivan Fernandez Calvo (kuisathaverat)"}
]
dependencies = [
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pytest==9.1.1",
]
requires-python = ">= 3.10"
license = {file = "LICENSE"}
keywords = ["pytest", "otel", "opentelemetry", "debug"]
classifiers = [
  "Environment :: Plugins",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
[project_urls]
Homepage = "https://github.com/kuisathaverat/pytest_otel"
Documentation = "https://github.com/kuisathaverat/pytest_otel/blob/main/README.md"
Repository = "https://github.com/kuisathaverat/pytest_otel.git"
Issues = "https://github.com/kuisathaverat/pytest_otel/issues"
Changelog = "https://github.com/kuisathaverat/pytest_otel/releases"

[project.optional-dependencies]
dotenv = [
  "python-dotenv>=1.0.0",
]
test = [
  "pytest-cov==7.1.0",
  "pre-commit==4.6.2",
  "pytest-docker==3.2.5",
  "mypy==2.3.1",
  "ruff==0.16.7",
  "build==1.6.1",
  "twine==7.0.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "pytest_otel.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_otel = ["py.typed"]

[project.entry-points.pytest11]
pytest_otel = "pytest_otel"

[tool.pytest]
addopts = ["-ra", "--showlocals", "-vv"]
testpaths = ["tests"]
xfail_strict = true
junit_family = "xunit2"

[tool.distutils.bdist_wheel]
universal = true

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  ".venv",
  ".git",
  "__pycache__",
  ".tox",
  ".mypy_cache",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
]
ignore = [
  "F401",  # unused imports (kept for backwards compatibility)
  "E203",  # whitespace before ':' (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"docs/demos/test/test_demo.py" = [
  "E402",  # pytest_plugins must be set before other imports in demo fixtures
  "F841",  # intentional unused variable to trigger a demo failure
  "B011",  # intentional `assert False` to trigger demo xfail scenarios
]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = [ "src", "tests" ]
parallel = true
branch = true
dynamic_context = "test_function"

[tool.coverage.report]
fail_under = "100"
skip_covered = true
show_missing = true

[tool.coverage.html]
show_contexts = true
skip_covered = false
skip_empty = false

[tool.coverage.paths]
source = [ "src" ]

[tool.mypy]
python_version = "3.10"
allow_untyped_defs = true
allow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
show_error_codes = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
warn_unused_configs = true
pretty = true
